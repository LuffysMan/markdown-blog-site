version: "3.8"

services:
  blog-backend:
    build: ..
    restart: unless-stopped
    networks:
      - blog-net
    environment:
      - BLOG_BASE_DIR=/opt/xiaocui/blogs/data
      - LOG_FILE_PATH=/opt/xiaocui/blogs/logs/app.log
    volumes:
      - /opt/xiaocui/blogs/data:/opt/xiaocui/blogs/data
      - /opt/xiaocui/blogs/logs:/opt/xiaocui/blogs/logs

  nginx:
    build: ./nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    networks:
      - blog-net
    volumes:
      - /opt/xiaocui/blogs/security/nginx_cert:/etc/nginx/ssl
    depends_on:
      - blog-backend

networks:
  blog-net:
    driver: bridge
