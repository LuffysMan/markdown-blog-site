<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>崔悦的官方网站</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
<div class="container">
    <header>
        <nav class="main-menu">
            <ul>
                <li th:each="item : ${menuItems}">
                    <a th:href="@{${item.url}}" th:text="${item.name}"></a>
                </li>
            </ul>
        </nav>
    </header>

    <div class="blog-layout">
        <aside class="blog-sidebar">
            <h2>所有文章</h2>
            <ul>
                <li>
                    <button class="add-blog-btn" id="addBlogBtn" title="添加新博客">+</button>
                </li>
                <li th:each="blog : ${allBlogs}">
                    <span>
                        <time th:datetime="${blog.date}" th:text="${blog.date}"/>
                    </span>
                    <a th:href="@{'/blogs/' + ${blog.id} + '/'}" th:class="${selectedBlog.id == blog.id} ? 'active' : ''" th:text="${blog.title}"></a>
                </li>
            </ul>
        </aside>

        <main class="blog-content">
            <article th:if="${selectedBlog}">
                <h1 th:text="${selectedBlog.title}"></h1>
                <p class="blog-date" th:text="${selectedBlog.date}"></p>
                <div id="markdown-content" th:utext="${selectedBlog.content}"></div>
            </article>
            <div th:unless="${selectedBlog}" class="no-blog">
                <p>没有找到博客内容</p>
            </div>
            <div id="upload-panel" class="upload-panel" style="display: none;">
                <h2>添加新博客</h2>
                <form id="newBlogForm" enctype="multipart/form-data">
                    <div class="form-group">
                        <label for="fileInput">选择文件</label>
                        <input type="file" id="fileInput" name="file" required />
                    </div>
                    <div class="form-group">
                        <label for="targetDir">目标目录</label>
                        <input type="text" id="targetDir" name="targetDir" required
                               placeholder="2026-5-27" />
                    </div>
                    <div class="form-group">
                        <label for="targetName">保存文件名</label>
                        <select id="targetName" name="targetName">
                            <option value="index.md">index.md</option>
                            <option value="original">保持源文件名</option>
                        </select>
                    </div>
                    <div id="upload-message" class="upload-message" style="display: none;"></div>
                    <div class="form-actions">
                        <button type="submit" class="btn-submit">上传</button>
                        <button type="button" class="btn-cancel" id="cancelUpload">取消</button>
                    </div>
                </form>
            </div>
        </main>
    </div>
</div>
<script th:src="@{/js/blogs.js}"></script>
</body>
</html>
